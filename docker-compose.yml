services:
  app:
    build: .
    container_name: residentialproperdocparse_app
    ports:
      - "8121:8000"
    environment:
      APP_NAME: ResidentialProperDocParse
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8121
      APP_KEY: "base64:zuF/ObF4s54tAfz5z2xMwlB706OHnAvNHN/1Bncygf0="
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: residentialproperdocparse
      DB_USERNAME: rpdp
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_CHANNEL: stderr
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: residentialproperdocparse_mysql
    environment:
      MYSQL_DATABASE: residentialproperdocparse
      MYSQL_USER: rpdp
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33091:3306"
    volumes:
      - rpdp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: residentialproperdocparse_redis
    ports:
      - "63811:6379"
    restart: unless-stopped

volumes:
  rpdp_mysql_data:
